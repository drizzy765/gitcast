name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for syntax errors
        run: |
          python -m py_compile cli/gitcast.py
          python -m py_compile api/server.py
          python -m py_compile api/routes.py
          python -m py_compile core/trigger.py
          python -m py_compile core/capture.py
          python -m py_compile core/ocr.py
          python -m py_compile ai/prompts.py
          python -m py_compile ai/generator.py
          python -m py_compile storage/logger.py
          python -m py_compile config/settings.py

      - name: Check for merge conflict markers
        run: |
          if grep -r "<<<<<<< HEAD\|=======\|>>>>>>>" \
            --include="*.py" --include="*.html" \
            --exclude-dir=".git" .; then
            echo "MERGE CONFLICTS FOUND"
            exit 1
          fi
          echo "No merge conflicts found"

      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_ocr_fix.py \
            || echo "Some tests failed - review output"
